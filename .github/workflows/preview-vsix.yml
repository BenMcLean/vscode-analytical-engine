name: Preview VSIX

on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build extension
        run: npm run package

      - name: Package VSIX
        run: npx @vscode/vsce package --out analytical-engine.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: analytical-engine-vsix
          path: analytical-engine.vsix
