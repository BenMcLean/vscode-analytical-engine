name: Package And Publish VSIX

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to marketplaces after packaging
        required: false
        type: boolean
        default: false

jobs:
  vsix:
    runs-on: ubuntu-latest
    env:
      SHOULD_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build extension
        run: npm run package

      - name: Package VSIX
        run: npx @vscode/vsce package --out analytical-engine.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: analytical-engine-vsix
          path: analytical-engine.vsix

      - name: Publish to marketplaces
        if: ${{ env.SHOULD_PUBLISH == 'true' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx @vscode/vsce publish --packagePath analytical-engine.vsix -p "$VSCE_PAT"
          fi

          if [ -n "$OVSX_TOKEN" ]; then
            npx ovsx publish analytical-engine.vsix -p "$OVSX_TOKEN"
          fi
