name: CI

on:
  push:
    branches:
      - master
      - release
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check-types

      - name: Run extension tests
        run: xvfb-run -a npm test

      - name: Bundle extension
        run: npm run package
